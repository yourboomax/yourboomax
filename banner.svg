    <text x="72" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#94A3B8">Programmer&#160;&#160;<tspan fill="#14B8A6">·</tspan>&#160;&#160;Cybersecurity&#160;&#160;<tspan fill="#14B8A6">·</tspan>&#160;&#160;Penetration Tester</text>

    <rect x="72" y="256" width="72" height="4" rx="2" fill="url(#accentLine)"/>

