      <text x="770" y="250"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> php artisan serve</tspan></text>
      <text x="770" y="274" fill="#94A3B8"><tspan fill="#5EEAD4">✓</tspan> Laravel app running on :8000</text>

      <text x="770" y="306"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> echo "$COLLAB"</tspan></text>
