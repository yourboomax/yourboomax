<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Dwi Jatmiko — Programmer, Cybersecurity, Penetration Tester">
  <defs>
