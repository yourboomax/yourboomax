    <g transform="translate(72,286)">
      <path d="M7 0 C3.1 0 0 3.1 0 7 C0 12.2 7 19 7 19 C7 19 14 12.2 14 7 C14 3.1 10.9 0 7 0 Z M7 9.6 C5.6 9.6 4.4 8.5 4.4 7 C4.4 5.6 5.6 4.4 7 4.4 C8.4 4.4 9.6 5.6 9.6 7 C9.6 8.5 8.4 9.6 7 9.6 Z" fill="#64748B"/>
    </g>
    <text x="96" y="301" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#7C8DA6">Jambi, Indonesia&#160;&#160;·&#160;&#160;<tspan fill="#5EEAD4">dwijatmiko.my.id</tspan></text>
  </g>

