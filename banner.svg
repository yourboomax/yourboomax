    <circle cx="768" cy="84" r="6" fill="#FF5F57"/>
    <circle cx="790" cy="84" r="6" fill="#FEBC2E"/>
    <circle cx="812" cy="84" r="6" fill="#28C840"/>
    <text x="975" y="89" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" fill="#64748B">dwi@jambi — zsh</text>

    <g font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5">
      <text x="770" y="138"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> whoami</tspan></text>
      <text x="770" y="162" fill="#94A3B8">dwi_jatmiko — developer &amp; pentester</text>

      <text x="770" y="194"><tspan fill="#34D399">$</tspan><tspan fill="#E2E8F0"> nmap -sV --top-ports 100 target</tspan></text>
